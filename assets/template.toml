# =============================================================================
#  chromaterm-rs (ct) configuration
# =============================================================================
#
# Generated by `ct config init`. Every setting is optional: delete what you
# don't need. Without any config, `ct` uses its built-in defaults.
#
# WHERE THIS FILE IS LOOKED FOR (first match wins)
#   1. --config PATH / $CHROMATERM_CONFIG
#   2. $XDG_CONFIG_HOME/chromaterm/config.toml   (~/.config/chromaterm/config.toml)
#   3. $XDG_CONFIG_HOME/chromaterm/config.json
#   4. ~/.chromaterm.toml, ~/.chromaterm.json
#   5. legacy ChromaTerm YAML (~/.chromaterm.yml …) — convert with `ct config import`
#   6. /etc/chromaterm/config.toml
#   Run `ct config path` to see which file is active.
#
# LAYERS
#   built-in defaults  →  this file  →  each `-i/--inline` value
#   Later layers override palette/pattern/theme entries by name. Inline rules
#   run before file rules, which run before the built-in rules.
#
# USEFUL COMMANDS
#   ct config check            validate everything (exit code 1 on error)
#   ct config show             print the effective, merged configuration
#   ct colors                  list every named color with a live swatch
#   ct patterns                list every named regex pattern
#   ct explain 'some text'     show which rule colors which part of a line
#   ct -r                      reload this config in every running ct
#   ct config export --oneline print this config as one line of JSON (for -i)
#
# WHY TOML?
#   * Comments everywhere.
#   * Literal strings keep regex backslashes as-is:  '\d+\.\d+'  (no "\\d").
#   * Multi-line literal strings ('''…''') hold long, commented (?x) regexes.
# =============================================================================

# Schema version of this file. Keep it at 1.
version = 1

# true  → the built-in default rules run AFTER your rules below (recommended).
# false → only your rules run. The built-in palette and patterns stay usable.
defaults = true

# Active theme: "dark" (default) or "light", or any theme you define below.
# Override per run with `--theme NAME` or $CHROMATERM_THEME.
# theme = "dark"


# -----------------------------------------------------------------------------
# SETTINGS
# -----------------------------------------------------------------------------
# read_timeout_ms : how long to wait (ms) for the rest of a partial line
#                   before highlighting what has arrived. Lower values feel
#                   snappier in interactive programs. Higher values split fewer
#                   words in slow output. Default: 2.
# color_mode      : "auto" (default; uses $COLORTERM/$TERM), "truecolor", or
#                   "256" (nearest xterm-256 color, for older terminals).
# max_line_bytes  : longest partial line held in memory before it is
#                   flushed in pieces. Default: 65536.
# unicode         : false (default) → \w \d \s \b are ASCII-only. That keeps the
#                   fast automaton engine running on lines with non-ASCII text
#                   (≈3× faster there). true → Unicode-aware classes, like
#                   Python's `re`. Can also be set per rule.
[settings]
# read_timeout_ms = 2
# color_mode = "auto"
# max_line_bytes = 65536
# unicode = false


# -----------------------------------------------------------------------------
# PALETTE — your named colors
# -----------------------------------------------------------------------------
# Values can be:
#   "#rrggbb" or "#rgb"      truecolor hex
#   "ansi:0" … "ansi:255"    terminal palette index (follows your terminal theme)
#   "default"                the terminal's default color
#   "<name>"                 alias of another palette entry
#
# The built-in palette (see `ct colors`) has raw hues (red, amber, teal, …) and
# semantic roles (error, warning, success, number, ipv4, url, path, …).
# Redefining a name here overrides it everywhere, built-in rules included.
[palette]
# brand    = "#ff6600"
# error    = "brand"          # make all errors use your brand color
# my-team  = "ansi:13"        # bright magenta from your terminal's palette


# -----------------------------------------------------------------------------
# THEMES — palette overlays you can switch between
# -----------------------------------------------------------------------------
# Built-in themes: "dark" (default) and "light". A theme only needs to override
# the entries that differ. Semantic roles alias raw hues, so overriding the
# hues is usually enough.
#
# [themes.solarized]
# red    = "#dc322f"
# green  = "#859900"
# yellow = "#b58900"
# blue   = "#268bd2"
#
# [themes.light]              # tweak a built-in theme
# error = "#c00000"


# -----------------------------------------------------------------------------
# PATTERNS — named, reusable regex fragments
# -----------------------------------------------------------------------------
# Use one as a rule's whole regex with   pattern = "name"
# or embed it inside a regex with        regex = 'host=${hostname}'
# (`${name}` expands to `(?:…)`. Write `\${` for a literal "${".)
#
# Built-in names include: url, email, ipv4, ipv6, mac, uuid, hash, digest,
# pointer, path, datetime, date, time, syslog-time, duration, size, semver,
# number, boolean, null, quoted, http-method, k8s-resource, aws-arn,
# log-error, log-warn, log-ok, … (see `ct patterns`).
#
# Tip: avoid capturing groups in patterns so embedding never shifts group numbers.
[patterns]
# hostname   = '\b(?:web|api|db)-[0-9]{2}\.prod\.example\.com\b'
# ticket     = '\b(?:OPS|INC)-[0-9]+\b'
# my-service = '\b(?:billing|ledger|gateway)-(?:api|worker)\b'


# -----------------------------------------------------------------------------
# RULES — what to highlight
# -----------------------------------------------------------------------------
# Fields:
#   description  free text, shown in errors, `ct explain` and `--benchmark`
#   regex        regular expression (Rust/RE2 syntax; look-around and
#                back-references also work, on a slower engine)
#   pattern      name of a pattern, instead of `regex`
#   color        a color spec, or a table of capture group → color spec
#   exclusive    true → later rules can't highlight inside this match
#   ignore_case  true → case-insensitive (same as a leading (?i))
#   unicode      per-rule override of settings.unicode
#   enabled      false → keep the rule but switch it off
#
# Color spec = space-separated tokens:
#   f.<name> / b.<name>   foreground / background from the palette
#   f#rrggbb / b#rrggbb   foreground / background hex
#   <name> / #rrggbb      shorthand for a foreground color
#   bold dim italic underline blink invert strike
#   e.g.  "f.error bold"   "f.white b.bg-red bold"   "#ff8800 underline"
#
# Rule order matters:
#   * Rules run top to bottom. Your rules run BEFORE the built-in ones.
#   * An exclusive match "owns" its text: later rules can't color inside it.
#   * Where non-exclusive highlights overlap, the later rule wins per attribute.
#
# Performance tips:
#   * Prefer \b word boundaries and specific literals over leading `.*`.
#   * Look-around ((?=…), (?<!…)) and back-references (\1) work, but they use
#     a backtracking engine. `ct --benchmark …` shows the cost of each rule.

# Example: highlight your own service names.
# [[rules]]
# description = "Our services"
# pattern = "my-service"
# color = "f.violet bold"
# exclusive = true

# Example: ticket ids, embedded pattern + ignore_case.
# [[rules]]
# description = "Ticket ids"
# regex = '${ticket}'
# ignore_case = true
# color = "f.black b.amber"

# Example: color capture groups separately (by index or by name).
# [[rules]]
# description = "user=… in audit logs"
# regex = '\buser=(?P<user>[\w.-]+)\s+(?:by|from)\s+(${ipv4})'
# color = { user = "f.gold bold", 2 = "f.cyan underline" }
# exclusive = true

# Example: a long regex across lines with comments, using (?x) verbose mode.
# [[rules]]
# description = "Deployment events"
# regex = '''(?x)
#   \b(?:deploy(?:ed|ing)?|rollout|rollback)\b   # the verb
#   \s+
#   ([\w.-]+)                                    # 1: what was deployed
# '''
# color = { 0 = "f.notice", 1 = "f.gold bold" }

# Example: a loud alert that stands out.
# [[rules]]
# description = "Kernel panic / OOM"
# regex = '\b(?:Kernel panic|Out of memory|oom-kill(?:er)?)\b'
# color = "f.white b.bg-red bold blink"
# exclusive = true
