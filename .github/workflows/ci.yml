name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features

  release-build:
    name: static musl build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Verify static linkage and report size
        run: |
          bin=target/${{ matrix.target }}/release/ct
          file "$bin"
          file "$bin" | grep -q "static"
          ls -l "$bin"
      - name: Smoke test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          bin=target/${{ matrix.target }}/release/ct
          printf 'ERROR 10.0.0.1 https://x.io\n' | "$bin" -N --rgb
          "$bin" -N config check
      - uses: actions/upload-artifact@v4
        with:
          name: ct-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ct
