# chromaterm-rs — GitHub Actions (this repository is a mirror of GitLab, which
# runs the equivalent .gitlab-ci.yml). Tags pushed by the mirror also create a
# GitHub Release here.
#
#   check   → rustfmt, clippy (all feature sets), tests
#   build   → 4 release binaries: {x86_64,aarch64} × {musl (static), gnu (glibc ≥ 2.28, faster)}
#   release → on tags vX.Y.Z: GitHub Release with binaries + SHA256SUMS

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (stable + rustfmt/clippy + musl targets).
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ci/check-version.sh "${GITHUB_REF_NAME}"

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: ci/build-release.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: ct-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history + tags for the changelog
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ct-*
          merge-multiple: true
      - run: ci/checksums.sh dist
      - run: ci/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ct ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/ct-*
            dist/SHA256SUMS
